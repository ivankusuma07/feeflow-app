packages:
  - apps/*
  - services/*
  - packages/*
  - contracts
allowBuilds:
  # Installs the platform binary that tsx (services) runs on.
  esbuild: true
  # postinstall is only a version check (scripts/appkit-version-check.js); not needed.
  "@reown/appkit": false
minimumReleaseAgeExclude:
  - "@types/react@19.3.1"
  - lucide-react@1.80.0
